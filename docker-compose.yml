services:
  # 1. Backend Service
  # Host Port: 8000
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kfood-backend
    ports:
      - "8000:8000"  # Host:Container
    volumes:
      - ./backend/app:/app/app  # 실시간 코드 수정 반영
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}  # .env 파일에서 가져옴
      # Docker 내부 통신용 주소 (서비스이름:내부포트)
      - FAISS_SERVICE_URL=http://faiss-service:8000
      - TRANSLATE_SERVICE_URL=http://translate-service:8000
    depends_on:
      - faiss-service
      - translate-service
    networks:
      - kfood-network

  # 2. FAISS DB Service (Vector Search)
  # Host Port: 8001
  faiss-service:
    build:
      context: ./faiss
      dockerfile: Dockerfile
    container_name: kfood-faiss
    ports:
      - "8001:8000"  # 외부 8001 접속 -> 내부 8000 연결
    volumes:
      - ./faiss/app:/app/app
      - ./faiss/data:/app/data  # 인덱스 파일 영구 저장
    environment:
      - DATA_PATH=/app/data/kfood_faiss_index.bin
      - EMBEDDING_DIM=768
    networks:
      - kfood-network

  # 3. Translate Service (Mock/Real)
  # Host Port: 8002
  translate-service:
    build:
      context: ./translate-service
      dockerfile: Dockerfile
    container_name: kfood-translate
    ports:
      - "8002:8000"  # 외부 8002 접속 -> 내부 8000 연결
    volumes:
      - ./translate-service/app:/app/app
    environment:
      - USE_MOCK=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}  # .env 파일에서 가져옴
    networks:
      - kfood-network
  # 4. 프론트엔드 웹 서비스 (추가)
  kfood-frontend:
    build: 
      context: ./frontend # 프론트엔드 프로젝트 폴더 경로
      dockerfile: Dockerfile
    container_name: kfood_frontend
    ports:
      - "3000:3000" # 로컬 3000번 포트로 접근 시, 컨테이너의 3000번 포트로 연결
    depends_on:
      - backend # 프론트엔드는 백엔드가 준비된 후 실행되는 것이 일반적
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: "on-failure"

# Network Definition
networks:
  kfood-network:
    driver: bridge